name: Claude BugBot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-bugbot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bugbot:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar configuración de Claude
        shell: bash
        env:
          CLAUDE_SETUP_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: |
          if [ -z "$CLAUDE_SETUP_TOKEN" ]; then
            echo "::error::Falta CLAUDE_SETUP_TOKEN en los secretos de Actions. Consulta docs/CLAUDE-BUGBOT.txt."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Claude BugBot
        uses: rekpero/claude-bugbot-github-action@v1.0.14
        with:
          claude-setup-token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
          github-token: ${{ github.token }}
          model: sonnet
